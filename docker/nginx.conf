# Resolver do Docker com TTL curto: réplicas que reiniciam (novos IPs) voltam à rotação.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;

  location / {
    set $upstream http://app:3000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Não reenviar POST para outra réplica em erro: a idempotência protege,
    # mas o retry é decisão do cliente (que tem a Idempotency-Key).
    proxy_next_upstream off;
  }
}
