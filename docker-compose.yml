name: wagering

# Emulador SQS selecionado por profile (default em .env: COMPOSE_PROFILES=localstack).
#   docker compose up -d                              -> LocalStack 4.14.0
#   COMPOSE_PROFILES=ministack docker compose up -d   -> MiniStack
# Os dois respondem pelo alias de rede "sqs", então app e sqs-init não mudam.

x-sqs-healthcheck: &sqs-healthcheck
  interval: 2s
  timeout: 3s
  retries: 60

x-app-env: &app-env
  # Usuário da APLICAÇÃO: sem superuser e sem ownership (GRANTs da migration 008).
  DATABASE_URL: postgresql://wagering_app:wagering_app@postgres:5432/wagering
  SQS_ENDPOINT: http://sqs:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    # 5442 no host para não colidir com outros Postgres locais.
    ports: ["5442:5432"]
    # max_connections folgado para 3+ réplicas × pool + processos de teste concorrentes.
    command: ["postgres", "-c", "max_connections=300", "-c", "deadlock_timeout=200ms"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    # Imagem community PRÉ-consolidação, congelada em 4.14.0: as releases 2026.x exigem
    # LOCALSTACK_AUTH_TOKEN (exit 55 sem licença). Ver ARCHITECTURE.md.
    image: localstack/localstack:4.14.0
    profiles: ["localstack"]
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports: ["4566:4566"]
    networks:
      default:
        aliases: [sqs]
    healthcheck:
      <<: *sqs-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(available\\|running\\)\"'"]

  ministack:
    # Alternativa MIT aceita pelo enunciado. Mesmo contrato de porta e alias.
    image: ministackorg/ministack:1.5.27
    profiles: ["ministack"]
    ports: ["4566:4566"]
    networks:
      default:
        aliases: [sqs]
    healthcheck:
      <<: *sqs-healthcheck
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/', timeout=2)\" 2>/dev/null || wget -q -O /dev/null http://localhost:4566/ 2>/dev/null"]

  migrate:
    build: { context: ., dockerfile: docker/app.Dockerfile }
    command: ["bun", "run", "src/infrastructure/persistence/migrate.ts", "up"]
    environment:
      <<: *app-env
      # Migrations rodam com o OWNER do schema e provisionam o login da app a partir de DATABASE_URL.
      MIGRATION_DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  sqs-init:
    build: { context: ., dockerfile: docker/app.Dockerfile }
    command: ["bun", "run", "src/infrastructure/messaging/sqs/provision-queues.ts"]
    environment: *app-env
    depends_on:
      localstack: { condition: service_healthy, required: false }
      ministack: { condition: service_healthy, required: false }
    restart: on-failure:10

  app:
    build: { context: ., dockerfile: docker/app.Dockerfile }
    environment:
      <<: *app-env
      # Cada réplica tem seu próprio pool, consumer SQS, publisher da outbox e worker de referências.
      DB_POOL_MAX: "10"
      SQS_WAIT_TIME_SECONDS: "5"
      SHUTDOWN_GRACE_MS: "20000"
      # Lote maior por transação: com lote 10 o publisher não acompanhou ~470 eventos/s (lag de 19s no test:load).
      OUTBOX_BATCH_SIZE: "100"
    deploy:
      replicas: 3
    # tini como PID 1: o SIGTERM chega à app, e o re-raise do sinal pelo Nest após o
    # shutdown encerra o processo (PID 1 ignora sinais sem handler).
    init: true
    # > SHUTDOWN_GRACE_MS: o consumer conclui o que está em andamento antes do SIGKILL.
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      sqs-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  loadgen:
    # Gerador de carga (bun run test:load) DENTRO da rede: mede sem o proxy de portas do host.
    build: { context: ., dockerfile: docker/loadgen.Dockerfile }
    profiles: ["load"]
    environment:
      <<: *app-env
      LOAD_BASE_URL: http://nginx:80
      LOG_LEVEL: silent

  nginx:
    # Ponto de entrada HTTP único que distribui entre as réplicas (DNS do compose resolve "app" para todas).
    image: nginx:1.29.8-alpine
    ports: ["8088:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: { condition: service_healthy }

volumes:
  pgdata:
